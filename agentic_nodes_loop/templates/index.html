<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVELSAN - Hybrid Code Generator</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PrismJS Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <!-- App Logic (Loaded early with defer to ensure copyCode is defined) -->
    <script src="/static/js/script_v5.js?v=7.0.0" defer></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=7.0.0">
</head>

<body>

    <header class="app-header">
        <div class="container">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                        <rect x="9" y="9" width="6" height="6"></rect>
                        <line x1="9" y1="1" x2="9" y2="4"></line>
                        <line x1="15" y1="1" x2="15" y2="4"></line>
                        <line x1="9" y1="20" x2="9" y2="23"></line>
                        <line x1="15" y1="20" x2="15" y2="23"></line>
                        <line x1="20" y1="9" x2="23" y2="9"></line>
                        <line x1="20" y1="14" x2="23" y2="14"></line>
                        <line x1="1" y1="9" x2="4" y2="9"></line>
                        <line x1="1" y1="14" x2="4" y2="14"></line>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>HAVELSAN <span>HCG</span></h1>
                    <span class="logo-subtitle">HYBRİD CODE GENERATOR</span>
                </div>
            </div>

            <div class="header-center">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    3 Model Aktif
                </div>
            </div>

            <div class="header-right">
                <div class="version-pill">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    v3.1.0
                </div>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- Hero Section -->
        <div class="hero-section">
            <h1 class="hero-title"> <span class="gradient-text-cyan">HAVELSAN HYBRİD CODE GENERATOR</span></h1>
        </div>

        <!-- Input Section -->
        <section class="input-section">
            <div class="input-wrapper">
                <textarea id="prompt" placeholder="arama algoritmasi yaz"></textarea>

                <div class="input-footer">
                    <div class="input-actions-left">
                        <span class="shortcut-hint">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z">
                                </path>
                            </svg>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 10 4 15 9 20"></polyline>
                                <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                            </svg>
                            hizli uretim
                        </span>
                    </div>
                    <div class="input-actions-right">
                        <button id="btn-generate" onclick="generate()" class="btn btn-action">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z">
                                </path>
                                <path d="M5 3v4"></path>
                                <path d="M19 17v4"></path>
                                <path d="M3 5h4"></path>
                                <path d="M17 19h4"></path>
                            </svg>
                            <span>Kod Uret</span>
                            <div id="loader" class="loader"></div>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Round 1: 3 Model Results -->
        <section id="round1-section" class="round1-section" style="display: none;">
            <h2>Model Competition Results</h2>

            <div class="results-grid">
                <div class="model-card">
                    <div class="model-header" id="header-model-1">Model 1</div>
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCode('code-model-1')">Copy</button>
                        <pre><code id="code-model-1" class="language-python">Generating code...</code></pre>
                    </div>
                    <div class="score-panel" id="score-model-1"></div>
                </div>

                <div class="model-card">
                    <div class="model-header" id="header-model-2">Model 2</div>
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCode('code-model-2')">Copy</button>
                        <pre><code id="code-model-2" class="language-python">Generating code...</code></pre>
                    </div>
                    <div class="score-panel" id="score-model-2"></div>
                </div>

                <div class="model-card">
                    <div class="model-header" id="header-model-3">Model 3</div>
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCode('code-model-3')">Copy</button>
                        <pre><code id="code-model-3" class="language-python">Generating code...</code></pre>
                    </div>
                    <div class="score-panel" id="score-model-3"></div>
                </div>
            </div>
        </section>

        <!-- Winner + Feedback Section -->
        <section id="winner-section" class="winner-section" style="display: none;">
            <div id="winner-info"></div>

            <!-- Feedback Iterations (optional) -->
            <div id="feedback-section" style="display: none;">
                <h3>Feedback Improvement Process</h3>
                <div id="feedback-iterations"></div>
            </div>

            <!-- Final Code -->
            <div class="final-code-section">
                <h3>Final Code</h3>
                <div class="code-container">
                    <button class="copy-btn" onclick="copyCode('final-code')">Copy</button>
                    <pre><code id="final-code" class="language-python">Final code will appear here...</code></pre>
                </div>
            </div>
        </section>

    </main>

    <!-- PrismJS Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>


</body>

</html>
