<body>
<h2 style="text-align:center; font-size:28px; margin-bottom:20px;">💻 Kod Üretim Modülü – LLM Karşılaştırma</h2>

<div style="width:100%; max-width:900px; margin:auto;">

    <textarea id="prompt" placeholder="Kod üretme isteğini yaz..." 
              style="width:100%; height:130px; border-radius:8px; border:1px solid #bbb; padding:10px; font-size:15px;"></textarea>

    <br><br>

    <button onclick="generate()" 
            style="padding:12px 25px; background:#0066ff; color:white; border:none; border-radius:6px; cursor:pointer; font-size:16px;">
        🚀 Kod Üret
    </button>

    <button onclick="analyze()" 
            style="padding:12px 25px; background:#28a745; color:white; border:none; border-radius:6px; cursor:pointer; font-size:16px; margin-left:10px;">
        📊 Kod Kalite Analiz Et
    </button>

    <br><br>

    <div id="results" 
         style="display:flex; gap:15px; justify-content:space-between; align-items:flex-start;">
    </div>
</div>

<div id="analysis-results" 
     style="margin-top:25px; display:flex; gap:15px; justify-content:space-between; align-items:flex-start;">
</div>

<script>
async function generate() {
    const prompt = document.getElementById("prompt").value;

    const response = await fetch("http://127.0.0.1:8000/generate-code", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt})
    });

    const data = await response.json();

    document.getElementById("results").innerHTML = `
    <div style="flex:1; background:#f8f9fa; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
        <h3 style="text-align:center; margin-bottom:12px; font-size:18px; font-weight:600;">LLaMA3 (Groq)</h3>
        <div style="background:#1e1e1e; color:#dcdcdc; padding:12px; border-radius:8px; overflow:auto; height:350px; font-size:13px; font-family:monospace; white-space:pre-wrap;">
            ${data.models["CodeLlama"]}
        </div>
    </div>

    <div style="flex:1; background:#f8f9fa; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
        <h3 style="text-align:center; margin-bottom:12px; font-size:18px; font-weight:600;">DeepSeek</h3>
        <div style="background:#1e1e1e; color:#dcdcdc; padding:12px; border-radius:8px; overflow:auto; height:350px; font-size:13px; font-family:monospace; white-space:pre-wrap;">
            ${data.models["DeepSeek-V3"]}
        </div>
    </div>

    <div style="flex:1; background:#f8f9fa; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
        <h3 style="text-align:center; margin-bottom:12px; font-size:18px; font-weight:600;">Gemini 2.5</h3>
        <div style="background:#1e1e1e; color:#dcdcdc; padding:12px; border-radius:8px; overflow:auto; height:350px; font-size:13px; font-family:monospace; white-space:pre-wrap;">
            ${data.models["Gemini 2.5"]}
        </div>
    </div>
`;
}

async function analyze() {
    const llama = document.querySelectorAll("#results div div")[0].innerText;
    const deepseek = document.querySelectorAll("#results div div")[1].innerText;
    const gemini = document.querySelectorAll("#results div div")[2].innerText;

    const response = await fetch("http://127.0.0.1:8000/analyze-results", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ llama, deepseek, gemini })
    });

    const data = await response.json();

    document.getElementById("analysis-results").innerHTML = `
        <div style="flex:1; background:#fff8e1; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
            <h3 style="text-align:center;">LLaMA3 Skoru</h3>
            <pre style="font-size:14px;">${JSON.stringify(data.scores.LLaMA3, null, 2)}</pre>
        </div>

        <div style="flex:1; background:#e1fff4; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
            <h3 style="text-align:center;">DeepSeek Skoru</h3>
            <pre style="font-size:14px;">${JSON.stringify(data.scores.DeepSeek, null, 2)}</pre>
        </div>

        <div style="flex:1; background:#e1e9ff; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
            <h3 style="text-align:center;">Gemini Skoru</h3>
            <pre style="font-size:14px;">${JSON.stringify(data.scores.Gemini, null, 2)}</pre>
        </div>

        <div style="flex:1; background:#fff0f0; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.12);">
            <h3 style="text-align:center; color:#c40000;">🏆 Kazanan Model</h3>
            <p style="font-size:22px; text-align:center; font-weight:bold;">${data.winner}</p>
        </div>
    `;
}
</script>

</body>
