<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"/>
    <title>Kod Üretim Modülü</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f6f6f6; }
        textarea { width: 100%; height: 120px; }
        .result-box { width: 32%; padding: 10px; background: white;
                      border: 1px solid #ccc; margin: 5px; float: left; }
        pre { white-space: pre-wrap; font-size: 14px; }
    </style>
</head>

<body>
<div id="debug" style="padding:10px; background:#ffeeee; border:1px solid #cc0000; margin-bottom:20px;">
    🔍 Sayfa yüklendi — Eğer burayı görüyorsan HTML doğru yükleniyor.<br>
    Eğer buton çalışmıyorsa tarayıcı konsolunu (Inspect → Console) kontrol et.
</div>
<script>
    console.log("HTML Yüklendi");
    window.onload = () => console.log("Window Loaded");
</script>

<h2>💻 Kod Üretim Modülü – LLM Karşılaştırma</h2>

<textarea id="prompt" placeholder="Kod üretme isteğini yaz..."></textarea>
<br><br>
<button onclick="generate()">Kod Üret</button>

<div id="results"></div>

<script>
async function generate() {
    const prompt = document.getElementById("prompt").value;

    const response = await fetch("http://127.0.0.1:8000/generate-code", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt})
    });

    const data = await response.json();

    document.getElementById("results").innerHTML = `
        <div class="result-box">
            <h3>CodeLlama</h3>
            <pre>${data.models["CodeLlama"]}</pre>
        </div>

        <div class="result-box">
            <h3>DeepSeek-V3</h3>
            <pre>${data.models["DeepSeek-V3"]}</pre>
        </div>

        <div class="result-box">
            <h3>Gemini 2.5</h3>
            <pre>${data.models["Gemini 2.5"]}</pre>
        </div>
    `;
}
</script>

</body>
</html>
