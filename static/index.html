<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <title>Agentic Kod Üretim ve Kalite Analizi</title>

    <style>
        :root {
            --bg: #020617;
            --card: #111827;
            --soft: #1f2933;
            --primary: #3b82f6;
            --success: #22c55e;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            font-family: "Inter", system-ui, -apple-system;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #020617, #020617);
            color: var(--text);
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 8px;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 35px;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: var(--card);
            border: 1px solid #374151;
            border-radius: 14px;
            color: var(--text);
            padding: 16px;
            font-size: 15px;
            resize: vertical;
        }

        textarea::placeholder {
            color: #6b7280;
        }

        .actions {
            margin: 25px 0 35px;
            display: flex;
            justify-content: center;
        }

        button {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;

            height: 420px;
            min-height: 420px;
            overflow: hidden;
        }

        .badge {
            align-self: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            background: #1e293b;
            color: #93c5fd;
            margin-bottom: 10px;
        }

        pre {
            background: #020617;
            border-radius: 12px;
            padding: 14px;
            color: #e5e7eb;
            font-size: 13px;

            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: pre-wrap;
        }

        .section-title {
            margin: 50px 0 20px;
            font-size: 22px;
            text-align: center;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .winner {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: var(--success);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1> <span>Agentic</span> Kod Üretim</h1>
        <div class="subtitle">
            Kod Üretimi + Kalite Analizi
        </div>

        <textarea id="prompt" placeholder="Örn: Python ile JWT kullanan bir REST API yaz...">
    </textarea>

        <div class="actions">
            <button onclick="generate()">Kod Üret & Analiz Et</button>
        </div>

        <!-- MODEL ÇIKTILARI -->
        <div id="results" class="grid"></div>

        <!-- METRİKLER -->
        <div id="metrics"></div>

    </div>

    <footer>
        HAVELSAN SUIT-AP · Agentic LLM Evaluation Platform
    </footer>

    <script>
        async function generate() {
            const prompt = document.getElementById("prompt").value;

            const res = await fetch("/generate-code", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt })
            });

            const data = await res.json();

            /* 🔹 MODEL ÇIKTILARI */
            document.getElementById("results").innerHTML =
                Object.entries(data.models).map(([model, code]) => `
            <div class="card">
                <div class="badge">${model}</div>
                <pre>${code}</pre>
            </div>
        `).join("");

            /* 🔹 METRİKLER + WINNER */
            document.getElementById("metrics").innerHTML = `
    <div class="section-title">Kalite Analizi</div>

    <div class="metrics">
        <div class="card" style="height:auto;">
            <pre>${JSON.stringify(data.metrics.code_quality, null, 2)}</pre>

            <div style="
                margin-top:16px;
                padding-top:12px;
                border-top:1px solid #1f2933;
                text-align:center;
            ">
                <div style="font-size:14px; color:var(--muted);">
                    En iyi model
                </div>
                <div class="winner">
                    ${data.winner}
                </div>
            </div>
        </div>
    </div>
`;
        }
    </script>

</body>

</html>
